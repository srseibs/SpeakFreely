name: Initialize Project from Template

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  template-init:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if initialization is needed
        id: check
        run: |
          if grep -q "MyProjectTemplate" settings.gradle.kts 2>/dev/null; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Perform Project Renames & Generate Project README
        if: steps.check.outputs.should_run == 'true'
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          
          # 1. Lowercase for package namespace (e.g. speakfreely)
          LOWER_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')
          
          # 2. Spaced name for app_name (e.g. SpeakFreely -> Speak Freely)
          SPACED_NAME=$(echo "$REPO_NAME" | sed 's/\([a-z]\)\([A-Z]\)/\1 \2/g')
          
          echo "Renaming to Root: $REPO_NAME, Namespace: $LOWER_NAME, App Name: $SPACED_NAME"

          # Update settings.gradle.kts
          sed -i "s/MyProjectTemplate/$REPO_NAME/g" settings.gradle.kts

          # Update app/build.gradle.kts
          sed -i "s/myprojecttemplate/$LOWER_NAME/g" app/build.gradle.kts

          # Update strings.xml app_name
          sed -i "s/MyProjectTemplate/$SPACED_NAME/g" app/src/main/res/values/strings.xml

          # Update themes.xml and AndroidManifest.xml theme names
          sed -i "s/MyProjectTemplate/$REPO_NAME/g" app/src/main/res/values/themes.xml
          sed -i "s/MyProjectTemplate/$REPO_NAME/g" app/src/main/AndroidManifest.xml

          # Update Kotlin package declarations and imports across source files
          find app/src -type f -name "*.kt" -exec sed -i "s/myprojecttemplate/$LOWER_NAME/g" {} +

          # Rename source directory folders
          find app/src -type d -name "myprojecttemplate" | while read -r dir; do
            parent=$(dirname "$dir")
            mv "$dir" "$parent/$LOWER_NAME"
          done

          # Overwrite template README.md with clean project README
          printf "# %s\n\nAn Android application built with Jetpack Compose, Koin, Kotlin Coroutines, and DataStore Preferences.\n\n## Getting Started\n\n1. Open the project in Android Studio.\n2. Perform an initial **Gradle Sync**.\n3. Build and run on an Android device or emulator.\n" "$SPACED_NAME" > README.md

      - name: Commit and Push Changes
        if: steps.check.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: initialize project names from template"
          git push
